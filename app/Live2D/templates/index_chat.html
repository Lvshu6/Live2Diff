<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2Diff · 对话</title>
    <style>
        * { box-sizing: border-box; }

        /* ── Anime manga background ── */
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            margin: 0; padding: 0;
            height: 100vh; overflow: hidden;
            background: linear-gradient(165deg, #fce8f8 0%, #ede5ff 32%, #d9eeff 66%, #edfcff 100%);
            background-attachment: fixed;
        }
        /* manga screentone dot overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle 1.4px at center,
                rgba(155,115,215,0.17) 0%, transparent 100%);
            background-size: 34px 34px;
            pointer-events: none; z-index: 0;
        }

        .page-wrapper {
            display: flex; flex-direction: row;
            height: 100vh; overflow: hidden;
            position: relative; z-index: 1;
        }

        /* ═══════════════════════════════════════
           LEFT COLUMN: persona panel + coord data
        ═══════════════════════════════════════ */
        .left-col {
            width: 210px; min-width: 210px;
            margin: 10px 0 10px 10px;
            display: flex; flex-direction: column; gap: 8px;
            transition: width 0.26s, min-width 0.26s;
            overflow: hidden;
        }
        .left-col.collapsed { width: 44px; min-width: 44px; }

        /* persona panel — takes 4/5 of left-col via flex ratio */
        .persona-panel {
            background: rgba(255,248,255,0.84);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(210,170,255,0.45);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(155,100,215,0.14);
            display: flex; flex-direction: column;
            overflow: hidden;
            flex: 4 1 0;
            min-height: 0;
        }
        .persona-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 12px;
            background: linear-gradient(90deg, #e879f9, #a855f7);
            color: white; font-weight: bold; font-size: 12px; flex-shrink: 0;
        }
        .left-col.collapsed .persona-head { justify-content: center; padding: 9px 0; }
        .ps-title { white-space: nowrap; overflow: hidden; }
        .left-col.collapsed .ps-title,
        .left-col.collapsed .persona-body,
        .left-col.collapsed .coord-panel { display: none; }
        .btn-toggle-ps {
            background: none; border: none; color: white;
            font-size: 14px; cursor: pointer; padding: 1px 4px;
            border-radius: 4px; flex-shrink: 0; line-height: 1;
        }
        .btn-toggle-ps:hover { background: rgba(255,255,255,0.22); }

        .persona-body {
            flex: 1; overflow-y: auto;
            padding: 8px 10px;
            display: flex; flex-direction: column; gap: 5px;
            font-size: 11px;
        }
        .ps-chip {
            background: linear-gradient(90deg,#fdf4ff,#ede9fe);
            border: 1px solid #d8b4fe; border-radius: 20px;
            padding: 3px 8px; font-size: 10px; color: #7e22ce;
            text-align: center; font-weight: bold;
        }
        .ps-label { font-size: 9px; font-weight: bold; color: #a855f7; margin-top: 3px; }
        .ps-row { display: flex; gap: 4px; align-items: center; }
        .persona-body select {
            flex: 1; padding: 3px 5px; border: 1px solid #d8b4fe;
            border-radius: 5px; font-size: 10px; background: white;
        }
        .persona-body input[type=text] {
            width: 100%; padding: 3px 6px; border: 1px solid #d8b4fe;
            border-radius: 5px; font-size: 10px; background: white;
        }
        .persona-body textarea {
            width: 100%; font-size: 10px; color: #333;
            resize: vertical; border: 1px solid #d8b4fe;
            border-radius: 5px; padding: 3px 6px;
            background: white; height: 40px; font-family: inherit;
        }
        .persona-body .sys-prompt { height: 68px; }
        .persona-body label { font-size: 9px; color: #bbb; }
        .examples-header {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 9px; color: #888; font-weight: bold;
        }
        .btn-add-example {
            background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe;
            border-radius: 4px; padding: 1px 5px; font-size: 9px; cursor: pointer;
            flex-shrink: 0; white-space: nowrap;
        }
        .example-pair {
            background: white; border: 1px solid #e5e7eb; border-radius: 5px;
            padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; position: relative;
        }
        .example-pair textarea { height: 28px; font-size: 9px; resize: none; }
        .btn-rm-example {
            position: absolute; top: 2px; right: 4px;
            background: none; border: none; color: #ccc; font-size: 11px; cursor: pointer; padding: 0;
        }
        .btn-rm-example:hover { color: #ef4444; }
        .persona-actions { display: flex; gap: 4px; margin-top: 2px; }
        .btn-save-persona {
            flex: 1; background: linear-gradient(90deg,#22c55e,#16a34a);
            color: white; border-radius: 5px; padding: 4px 0; font-size: 10px; cursor: pointer; border: none;
        }
        .btn-del-persona {
            background: #ef4444; color: white; border-radius: 5px;
            padding: 4px 6px; font-size: 10px; cursor: pointer; border: none;
        }
        .btn-new-persona {
            background: linear-gradient(90deg,#a855f7,#7c3aed); color: white;
            border-radius: 5px; padding: 4px 7px; font-size: 10px; cursor: pointer; border: none;
        }

        /* coordinate data panel — occupies remaining left-col height */
        .coord-panel {
            flex: 1; min-height: 80px;
            background: rgba(255,248,255,0.80);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(210,170,255,0.38);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(155,100,215,0.10);
            padding: 9px 10px;
            display: flex; flex-direction: column; gap: 5px;
            overflow: hidden;
        }
        .coord-panel h3 { margin: 0; font-size: 10px; color: #bbb; flex-shrink: 0; }
        .coord-panel textarea {
            flex: 1; min-height: 0;
            font-family: monospace; font-size: 9px;
            border: 1px solid #e5e7eb; border-radius: 5px;
            padding: 4px; resize: none; background: white;
        }

        /* ═══════════════════════════════════════
           CENTER: controls bar + image | bubbles
        ═══════════════════════════════════════ */
        .center-zone {
            flex: 1 1 0; min-width: 0;
            display: flex; flex-direction: column;
            padding: 10px 8px;
            overflow: hidden;
        }

        .controls {
            display: flex; gap: 6px; align-items: center;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(12px);
            padding: 5px 11px; border-radius: 10px;
            box-shadow: 0 2px 10px rgba(155,100,215,0.12);
            border: 1px solid rgba(210,170,255,0.30);
            flex-wrap: wrap; flex-shrink: 0; margin-bottom: 8px;
        }
        button {
            padding: 4px 10px; cursor: pointer; border: none;
            border-radius: 6px; font-weight: bold; font-size: 11px; transition: all 0.15s;
        }
        .btn-mode { background: rgba(240,233,255,0.85); color: #555; border: 1px solid #d8b4fe; }
        .btn-mode.active { background: linear-gradient(90deg,#a855f7,#7c3aed); color: white; border-color: transparent; }
        .btn-mode:hover:not(.active) { background: rgba(220,195,255,0.85); }
        .btn-reset { background: linear-gradient(90deg,#f87171,#ef4444); color: white; }
        #btn-track { background: linear-gradient(90deg,#a855f7,#6366f1); color: white; }
        .size-control {
            display: flex; align-items: center; gap: 4px;
            font-size: 10px; color: #999;
            border-left: 1px solid #e0d4ff; padding-left: 8px;
        }
        input[type=range] { cursor: pointer; accent-color: #a855f7; }
        #size-value { font-weight: bold; color: #7e22ce; width: 18px; }
        .status-msg { font-size: 10px; color: #bbb; font-weight: 500; }
        #mode-hint { font-size: 10px; color: #d0b8f0; margin-left: 2px; }

        /* image | bubble area */
        .character-chat-area {
            flex: 1; min-height: 0;
            display: flex; flex-direction: row;
            align-items: stretch; gap: 0;
        }

        /* image wrap — manga panel */
        .image-wrap {
            flex: 0 0 auto;
            display: flex; align-items: flex-start;
            padding-right: 10px;
        }
        .container {
            position: relative;
            box-shadow: 0 5px 22px rgba(130,85,195,0.20);
            border: 2px solid rgba(210,170,255,0.50);
            border-radius: 10px; overflow: hidden;
            background: white; user-select: none;
        }
        #source-image {
            display: block;
            max-width: 660px;
            max-height: calc(100vh - 118px);
            width: auto; height: auto;
            pointer-events: none;
        }
        #svg-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: crosshair; touch-action: none;
        }
        .trajectory-line { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 5,5; opacity: 0.8; pointer-events: none; }
        .point-t0 { fill: #f43f5e; stroke: white; stroke-width: 1.5px; pointer-events: none; }
        .point-t1 { fill: #22c55e; stroke: #14532d; stroke-width: 1.5px; cursor: pointer; }
        .point-t1.selected { fill: #fbbf24; stroke: #d97706; stroke-width: 2px; filter: drop-shadow(0 0 3px rgba(0,0,0,0.35)); }

        /* ═══════════════════════════════════════
           BUBBLE ZONE — no container box, manga feel
        ═══════════════════════════════════════ */
        .bubble-zone {
            flex: 1 1 0; min-width: 240px;
            display: flex; flex-direction: column;
            padding-left: 10px; overflow: hidden;
        }

        /* messages scroll area — transparent, manga background shows */
        .chat-messages {
            flex: 1; overflow-y: auto;
            padding: 12px 14px 8px;
            display: flex; flex-direction: column; gap: 14px;
            background: transparent;
        }

        .msg {
            position: relative; max-width: 84%;
            padding: 9px 13px;
            font-size: 13px; line-height: 1.65;
            white-space: pre-wrap; word-break: break-word;
        }

        /* ── AI: manga speech bubble, tail on left ── */
        .msg.assistant {
            align-self: flex-start;
            background: #ffffff;
            border: 2.5px solid #1c1c2e;
            border-radius: 16px 16px 16px 4px;
            color: #1a1a1a;
            box-shadow: 4px 4px 0 rgba(70,35,110,0.14);
            margin-left: 20px;
        }
        .msg.assistant::before {
            content: '';
            position: absolute; left: -20px; top: 13px;
            width: 0; height: 0; border-style: solid;
            border-width: 9px 20px 9px 0;
            border-color: transparent #1c1c2e transparent transparent;
        }
        .msg.assistant::after {
            content: '';
            position: absolute; left: -14px; top: 16px;
            width: 0; height: 0; border-style: solid;
            border-width: 6px 14px 6px 0;
            border-color: transparent #ffffff transparent transparent;
        }

        /* streaming cursor */
        .cursor-blink {
            display: inline-block; width: 2px; height: 0.88em;
            background: #1c1c2e; margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── User bubble, tail on right ── */
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg,#e879f9,#a855f7);
            color: white;
            border: 2.5px solid #7e22ce;
            border-radius: 16px 16px 4px 16px;
            box-shadow: -4px 4px 0 rgba(70,35,110,0.14);
            margin-right: 20px;
        }
        .msg.user::before {
            content: '';
            position: absolute; right: -20px; top: 13px;
            width: 0; height: 0; border-style: solid;
            border-width: 9px 0 9px 20px;
            border-color: transparent transparent transparent #7e22ce;
        }
        .msg.user::after {
            content: '';
            position: absolute; right: -14px; top: 16px;
            width: 0; height: 0; border-style: solid;
            border-width: 6px 0 6px 14px;
            border-color: transparent transparent transparent #e879f9;
        }

        .msg.error {
            align-self: flex-start; background: #fff1f2;
            border: 2px solid #f43f5e; border-radius: 12px;
            color: #be123c; margin-left: 20px;
        }

        /* input bar — minimal glass strip */
        .bubble-input {
            display: flex; gap: 6px;
            padding: 7px 9px;
            background: rgba(255,252,255,0.70);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(210,170,255,0.35);
            border-radius: 11px; flex-shrink: 0; margin-top: 6px;
        }
        .bubble-input textarea {
            flex: 1; height: 44px; resize: none; font-size: 12px;
            border: 1.5px solid #d8b4fe; border-radius: 8px;
            padding: 5px 9px; background: rgba(255,255,255,0.92);
            font-family: inherit; transition: border-color 0.18s;
        }
        .bubble-input textarea:focus { outline: none; border-color: #a855f7; }
        .btn-send {
            background: linear-gradient(135deg,#e879f9,#a855f7);
            color: white; border-radius: 8px; padding: 0 13px;
            font-size: 12px; align-self: stretch; border: none;
        }
        .btn-send:disabled { background: #d1d5db; cursor: not-allowed; }
        .btn-clear-chat {
            background: rgba(240,233,255,0.85); color: #7e22ce;
            border: 1px solid #d8b4fe; border-radius: 8px;
            padding: 0 8px; font-size: 11px; align-self: stretch;
        }

        /* ═══════════════════════════════════════
           RIGHT: session list
        ═══════════════════════════════════════ */
        .session-col {
            width: 136px; min-width: 136px;
            padding: 10px 10px 10px 0;
        }
        .session-sidebar {
            height: 100%;
            background: rgba(255,248,255,0.84);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(210,170,255,0.40);
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(155,100,215,0.11);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .session-head {
            padding: 9px 10px 6px;
            border-bottom: 1px solid rgba(210,170,255,0.28);
            text-align: center; flex-shrink: 0;
        }
        .session-head .sh-title { font-weight: bold; font-size: 12px; color: #7e22ce; }
        .session-head .api-status { display: block; font-size: 9px; color: #a855f7; margin-top: 2px; }
        .btn-new-session {
            margin: 6px; padding: 5px 0;
            background: linear-gradient(90deg,#e879f9,#a855f7);
            color: white; border: none; border-radius: 7px;
            font-size: 11px; cursor: pointer; width: calc(100% - 12px);
        }
        .btn-new-session:hover { opacity: 0.88; }
        .session-list {
            flex: 1; overflow-y: auto;
            padding: 3px 5px; display: flex; flex-direction: column; gap: 2px;
        }
        .session-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 6px; border-radius: 6px;
            cursor: pointer; font-size: 10px; color: #555; transition: background 0.14s;
        }
        .session-item:hover { background: rgba(210,170,255,0.22); }
        .session-item.active { background: rgba(168,85,247,0.14); color: #7e22ce; font-weight: bold; }
        .session-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-del-session {
            background: none; border: none; color: #ddd;
            font-size: 12px; cursor: pointer; padding: 0 2px; flex-shrink: 0;
        }
        .btn-del-session:hover { color: #ef4444; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.26); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.44); }

        /* ── Agent mode extras ── */
        .btn-agent-mode {
            background: rgba(240,233,255,0.85); color: #555;
            border: 1.5px solid #d8b4fe; border-radius: 6px;
            font-weight: bold; font-size: 11px; padding: 4px 10px; cursor: pointer;
            transition: all 0.15s;
        }
        .btn-agent-mode.active {
            background: linear-gradient(90deg,#0ea5e9,#6366f1); color: white; border-color: transparent;
        }
        .msg.tool-call {
            align-self: flex-start; max-width: 84%;
            background: #f0f9ff; border: 1.5px dashed #38bdf8;
            border-radius: 10px; padding: 6px 12px;
            font-size: 11px; color: #0369a1; margin-left: 20px;
        }
        .msg.tool-result {
            align-self: flex-start; max-width: 84%;
            background: #f0fdf4; border: 1px solid #86efac;
            border-radius: 10px; padding: 6px 12px;
            font-size: 11px; color: #166534; margin-left: 20px;
            white-space: pre-wrap; word-break: break-word;
        }
        .motion-badge {
            display: inline-block; font-size: 9px; font-weight: bold;
            background: linear-gradient(90deg,#e879f9,#a855f7);
            color: white; border-radius: 10px; padding: 1px 7px;
            margin-left: 6px; vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="page-wrapper">

    <!-- ══ LEFT: persona + coord ══ -->
    <div class="left-col" id="left-col">
        <div class="persona-panel">
            <div class="persona-head">
                <span class="ps-title">🎭 人格设置</span>
                <button class="btn-toggle-ps" id="btn-toggle-ps" onclick="togglePersonaSidebar()">◀</button>
            </div>
            <div class="persona-body" id="persona-sidebar-body">
                <div class="ps-chip" id="active-persona-label">未启用</div>
                <div class="ps-label">选择</div>
                <div class="ps-row">
                    <select id="persona-select" onchange="loadSelectedPersona()">
                        <option value="" disabled style="display:none">— 新人格 —</option>
                    </select>
                    <button class="btn-del-persona" onclick="deletePersona()" title="删除">🗑</button>
                </div>
                <div class="ps-label">编辑</div>
                <input type="text" id="persona-name" placeholder="人格名称">
                <textarea id="persona-description" placeholder="简短描述"></textarea>
                <textarea id="persona-system-prompt" class="sys-prompt" placeholder="系统提示词：角色性格、风格…"></textarea>
                <div class="examples-header">
                    <span>示例对话</span>
                    <button class="btn-add-example" onclick="addExample()">+ 添加</button>
                </div>
                <div id="examples-list"></div>
                <div class="persona-actions">
                    <button class="btn-new-persona" onclick="newPersona()">✨</button>
                    <button class="btn-save-persona" onclick="savePersona()">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- coordinate data at bottom-left -->
        <div class="coord-panel">
            <h3>坐标数据</h3>
            <textarea id="data-output" readonly>等待操作…</textarea>
        </div>
    </div>

    <!-- ══ CENTER: controls + image | floating bubbles ══ -->
    <div class="center-zone">
        <div class="controls">
            <button id="btn-create" class="btn-mode" onclick="setMode('create')">🔴 Create</button>
            <button id="btn-drag"   class="btn-mode"        onclick="setMode('drag')">🟢 Drag</button>
            <button class="btn-reset" onclick="resetPoints()">Reset</button>
            <button id="btn-track" onclick="sendTrackPoints()">📡 CoTracker</button>
            <div class="size-control">
                <label>Size:</label>
                <input type="range" id="point-size-slider" min="3" max="20" value="6" step="1">
                <span id="size-value">6</span>px
            </div>
            <span id="status-msg" class="status-msg">待机中</span>
            <span id="mode-hint">点击 Create 进入标注模式</span>
        </div>

        <div class="character-chat-area">
            <!-- character image (manga panel) -->
            <div class="image-wrap">
                <div class="container" id="img-container">
                    <img id="source-image" src="{{ image_src }}" alt="Loading…" crossorigin="anonymous">
                    <svg id="svg-overlay"></svg>
                </div>
            </div>

            <!-- floating bubbles — no box, just manga background -->
            <div class="bubble-zone">
                <div class="chat-messages" id="chat-messages">
                    <div class="msg assistant">你好！有什么可以帮你的吗？</div>
                </div>
                <div class="bubble-input">
                    <textarea id="chat-input"
                        placeholder="发消息（Enter 发送，Shift+Enter 换行）；/reset 清空上下文"
                        onkeydown="handleChatKey(event)"></textarea>
                    <button class="btn-send" id="btn-send" onclick="sendChat()">发送</button>
                    <button class="btn-clear-chat" onclick="clearChat()">清空</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══ RIGHT: session history ══ -->
    <div class="session-col">
        <div class="session-sidebar">
            <div class="session-head">
                <div class="sh-title">💬 会话</div>
            </div>
            <button class="btn-new-session" onclick="newSession()">＋ 新对话</button>
            <div class="session-list" id="session-list"></div>
        </div>
    </div>

</div><!-- end .page-wrapper -->

<script>
// ================================================================
// Left sidebar toggle
// ================================================================
let personaSidebarOpen = true;
function togglePersonaSidebar() {
    personaSidebarOpen = !personaSidebarOpen;
    document.getElementById('left-col').classList.toggle('collapsed', !personaSidebarOpen);
    document.getElementById('btn-toggle-ps').textContent = personaSidebarOpen ? '◀' : '▶';
}

// ================================================================
// Image annotation
// ================================================================
let pointsT0 = [], pointsT1 = [];
let currentMode = 'view';
let inAnnotateMode = false;
let imagePollTimer = null;
let selectedIndex = -1;
let isDragging = false;
let baseRadius = 6;
let selectedRadius = 10;
let currentImgPath = '{{ image_src }}';
let isFetchingImage = false;

function startImagePoll() {
    if (imagePollTimer) return;
    imagePollTimer = setInterval(fetchCurrentImage, 50);
}
function stopImagePoll() {
    if (imagePollTimer) { clearInterval(imagePollTimer); imagePollTimer = null; }
}

async function enterAnnotateMode() {
    if (inAnnotateMode) return;
    inAnnotateMode = true;
    try {
        const res = await fetch('/api/control/mode', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: 'annotate' })
        });
        const result = await res.json();
        if (result.image_src) {
            currentImgPath = result.image_src;
            img.src = result.image_src;
        }
    } catch(e) { console.error('enterAnnotateMode failed:', e); }
}

const svg = document.getElementById('svg-overlay');
const img = document.getElementById('source-image');
const statusMsg = document.getElementById('status-msg');
const modeHint = document.getElementById('mode-hint');
const dataOutput = document.getElementById('data-output');
const sizeSlider = document.getElementById('point-size-slider');
const sizeValueDisplay = document.getElementById('size-value');

let lastSendTime = 0;
const SEND_INTERVAL = 100;
let lastBestFrameTime = 0;
const BEST_FRAME_INTERVAL = 50;
let isFetchingBestFrame = false;   // 独立于 fetchCurrentImage 的锁

function sendPointsThrottled(triggerImage) {
    const now = Date.now();
    if (now - lastSendTime > SEND_INTERVAL) { lastSendTime = now; sendPointsToBackend(triggerImage); }
}
function fetchBestFrameThrottled() {
    const now = Date.now();
    if (now - lastBestFrameTime < BEST_FRAME_INTERVAL) return;
    lastBestFrameTime = now; fetchBestFrame();
}
async function fetchBestFrame() {
    if (isFetchingBestFrame) return;
    isFetchingBestFrame = true;
    try {
        const t1 = pointsT1.map(p => [p.x, p.y]);
        const res = await fetch('/api/best-frame', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ t1, current_image_path: currentImgPath })
        });
        const result = await res.json();
        if (result.image_src && result.image_src !== currentImgPath) {
            currentImgPath = result.image_src;
            img.src = result.image_src;
            statusMsg.textContent = `Drag | ${result.image_src.split('/').pop()}`;
        }
        // Active drag: T0 updates to new frame's keypoints;
        // non-dragged points also shift T1; dragged point's T1 stays under the mouse.
        if (result.t0_points && result.t0_points.length === pointsT0.length &&
            pointsT0.length > 0) {
            for (let i = 0; i < pointsT0.length; i++) {
                const nx = result.t0_points[i][0], ny = result.t0_points[i][1];
                const dx = nx - pointsT0[i].x,    dy = ny - pointsT0[i].y;
                pointsT0[i] = { x: nx, y: ny };
                if (i !== selectedIndex) {
                    pointsT1[i] = { x: pointsT1[i].x + dx, y: pointsT1[i].y + dy };
                }
            }
            renderPoints();
        }
    } catch(e) { console.error('fetchBestFrame failed:', e); }
    finally { isFetchingBestFrame = false; }
}

sizeSlider.addEventListener('input', function(e) {
    baseRadius = parseInt(e.target.value);
    selectedRadius = Math.max(baseRadius + 2, Math.floor(baseRadius * 1.6));
    sizeValueDisplay.textContent = baseRadius;
    if (pointsT0.length > 0) renderPoints();
});

img.onload = function() {
    const w = img.naturalWidth, h = img.naturalHeight;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.style.width = '100%'; svg.style.height = '100%';
    baseRadius = parseInt(sizeSlider.value);
    selectedRadius = Math.max(baseRadius + 2, Math.floor(baseRadius * 1.6));
    updateDataText();
};

function setMode(mode) {
    if (!inAnnotateMode) {
        enterAnnotateMode().then(() => _applyMode(mode));
        return;
    }
    _applyMode(mode);
}

function _applyMode(mode) {
    currentMode = mode; selectedIndex = -1; isDragging = false;
    renderPoints(); updateDataText();
    document.getElementById('btn-create').classList.toggle('active', mode === 'create');
    document.getElementById('btn-drag').classList.toggle('active', mode === 'drag');
    if (mode === 'create') {
        statusMsg.textContent = "Create Mode";
        modeHint.textContent = "点击图像空白处添加控制点。";
        svg.style.cursor = "crosshair";
    } else {
        statusMsg.textContent = "Drag Mode";
        modeHint.textContent = "点击绿点选中 → 移动鼠标 → 再次点击确认。";
        svg.style.cursor = "default";
    }
}

function getSVGPoint(evt) {
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
}

svg.addEventListener('mousedown', function(evt) {
    if (evt.button !== 0) return;
    if (currentMode === 'view') return;
    const { x, y } = getSVGPoint(evt);
    if (currentMode === 'create') {
        pointsT0.push({x, y}); pointsT1.push({x, y});
        renderPoints(); updateDataText();
    } else if (currentMode === 'drag') {
        if (selectedIndex !== -1) {
            selectedIndex = -1; isDragging = false;
            statusMsg.textContent = "位置已确认";
            renderPoints(); updateDataText(); fetchBestFrame();
            fetch('/api/control/clear-queue', { method: 'POST' }).catch(() => {});
            startImagePoll();   // 拖拽结束，恢复 LLM 动画轮询
        } else {
            const thr = Math.max(10, baseRadius * 2.5);
            let found = -1;
            for (let i = pointsT1.length - 1; i >= 0; i--) {
                const p = pointsT1[i];
                if (Math.sqrt((x-p.x)**2 + (y-p.y)**2) < thr) { found = i; break; }
            }
            if (found !== -1) {
                selectedIndex = found;
                statusMsg.textContent = `已选中点 #${found}`;
                renderPoints();
                stopImagePoll();   // 拖拽开始，优先用户操作
            } else {
                selectedIndex = -1; renderPoints();
                statusMsg.textContent = "未选中点";
            }
        }
    }
});

svg.addEventListener('mousemove', function(evt) {
    if (currentMode !== 'drag' || selectedIndex === -1) return;
    const { x, y } = getSVGPoint(evt);
    pointsT1[selectedIndex] = { x, y };
    updateDragVisualization(selectedIndex, x, y);
    updateDataText(); fetchBestFrameThrottled();
    if (!isDragging) isDragging = true;
});

function renderPoints() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    pointsT0.forEach((p0, i) => {
        const p1 = pointsT1[i];
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p0.x); line.setAttribute("y1", p0.y);
        line.setAttribute("x2", p1.x); line.setAttribute("y2", p1.y);
        line.setAttribute("class", "trajectory-line");
        if (i === selectedIndex) {
            line.setAttribute("stroke", "#f59e0b"); line.setAttribute("stroke-width", "3");
            line.setAttribute("stroke-dasharray", "0"); line.setAttribute("opacity", "1");
        }
        line.setAttribute("id", `line-${i}`);
        svg.appendChild(line);
    });
    pointsT0.forEach(p => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
        c.setAttribute("r", baseRadius); c.setAttribute("class", "point-t0");
        svg.appendChild(c);
    });
    pointsT1.forEach((p, i) => {
        const isSel = (i === selectedIndex);
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
        c.setAttribute("r", isSel ? selectedRadius : baseRadius);
        c.setAttribute("class", isSel ? "point-t1 selected" : "point-t1");
        c.style.pointerEvents = "none";
        svg.appendChild(c);
    });
}

function updateDragVisualization(index, newX, newY) {
    const line = document.getElementById(`line-${index}`);
    if (line) { line.setAttribute("x2", newX); line.setAttribute("y2", newY); }
    const node = svg.children[pointsT0.length * 2 + index];
    if (node) { node.setAttribute("cx", newX); node.setAttribute("cy", newY); }
}

function updateDataText() {
    if (pointsT0.length === 0) { dataOutput.value = "No data"; return; }
    let text = `# Points: ${pointsT0.length}\n`;
    pointsT0.forEach((p, i) => {
        const p1 = pointsT1[i];
        const mark = i === selectedIndex ? " [编辑]" : "";
        text += `P${i}: [${p.x.toFixed(1)},${p.y.toFixed(1)}]→[${p1.x.toFixed(1)},${p1.y.toFixed(1)}]${mark}\n`;
    });
    dataOutput.value = text;
}

function resetPoints() {
    if (pointsT0.length === 0) return;
    if (confirm("确认删除所有控制点？")) {
        pointsT0 = []; pointsT1 = []; selectedIndex = -1; isDragging = false;
        renderPoints(); updateDataText();
        sendPointsToBackend(false);
        // Return to view mode so idle animation resumes
        inAnnotateMode = false;
        currentMode = 'view';
        document.getElementById('btn-create').classList.remove('active');
        document.getElementById('btn-drag').classList.remove('active');
        statusMsg.textContent = "待机中";
        modeHint.textContent = "点击 Create 进入标注模式";
        svg.style.cursor = "default";
        fetch('/api/control/mode', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: 'view' })
        }).catch(() => {});
        startImagePoll();
    }
}

async function sendPointsToBackend(triggerImage) {
    try {
        await fetch('/api/points', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                t0: pointsT0.map(p => [p.x.toFixed(1), p.y.toFixed(1)]),
                t1: pointsT1.map(p => [p.x.toFixed(1), p.y.toFixed(1)]),
                trigger_image: triggerImage
            })
        });
    } catch(e) { console.error("Failed to send data:", e); }
}

async function sendTrackPoints() {
    if (pointsT0.length === 0) { alert("请先创建至少一个控制点！"); return; }
    const trackPoints = pointsT0.map(p => [parseFloat(p.x.toFixed(1)), parseFloat(p.y.toFixed(1))]);
    try {
        const res = await fetch('/api/cotracker-track', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ t0_points: trackPoints })
        });
        const result = await res.json();
        statusMsg.textContent = result.status === "success"
            ? `✅ 已发送 ${trackPoints.length} 个跟踪点` : "❌ 发送失败";
    } catch(e) { statusMsg.textContent = "❌ 网络错误"; }
}

async function fetchCurrentImage() {
    if (isFetchingImage) return;
    isFetchingImage = true;
    try {
        const res = await fetch('/api/current-image');
        const result = await res.json();
        if (result.image_src && result.image_src !== currentImgPath) {
            currentImgPath = result.image_src;
            img.src = result.image_src;
            statusMsg.textContent = `切换帧: ${result.image_src.split('/').pop()}`;
            // Passive frame change: shift both T0 and T1 by the keypoint delta
            if (pointsT0.length > 0 && result.t0_points &&
                result.t0_points.length === pointsT0.length) {
                for (let i = 0; i < pointsT0.length; i++) {
                    const nx = result.t0_points[i][0], ny = result.t0_points[i][1];
                    const dx = nx - pointsT0[i].x,    dy = ny - pointsT0[i].y;
                    pointsT0[i] = { x: nx, y: ny };
                    pointsT1[i] = { x: pointsT1[i].x + dx, y: pointsT1[i].y + dy };
                }
                renderPoints();
                updateDataText();
            }
        }
    } catch(e) { console.error("Failed to fetch latest image:", e); }
    finally { isFetchingImage = false; }
}

// ================================================================
// Persona management
// ================================================================
let currentPersona = { name: '', description: '', system_prompt: '', begin_dialogs: [] };

function togglePersonaEditor() {} // kept for compat

async function fetchPersonaList() {
    try {
        const res = await fetch('/api/personas');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const sel = document.getElementById('persona-select');
        const cur = sel.value;
        sel.innerHTML = '<option value="" disabled style="display:none">— 新人格 —</option>';
        for (const name of Object.keys(data)) {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name;
            if (name === cur) opt.selected = true;
            sel.appendChild(opt);
        }
        if (!sel.value && data['default']) sel.value = 'default';
        return data;
    } catch(e) {
        console.error('[personas] fetch failed:', e);
        // Ensure at least a default option exists as fallback
        const sel = document.getElementById('persona-select');
        if (sel && sel.options.length <= 1) {
            const opt = document.createElement('option');
            opt.value = 'default'; opt.textContent = 'default';
            sel.appendChild(opt);
            sel.value = 'default';
        }
        return { default: { name:'default', description:'', system_prompt:'', begin_dialogs:[] } };
    }
}

function loadSelectedPersona() {
    const name = document.getElementById('persona-select').value;
    if (!name) return;
    fetch('/api/personas').then(r => r.json()).then(data => {
        const p = data[name]; if (!p) return;
        applyPersonaToForm(p); activatePersona(p);
    });
}

function applyPersonaToForm(p) {
    const ni = document.getElementById('persona-name');
    ni.value = p.name || '';
    const isDefault = p.name === 'default';
    ni.readOnly = isDefault; ni.style.background = isDefault ? '#f5f5f5' : '';
    ni.title = isDefault ? 'default 人格名称不可修改' : '';
    document.getElementById('persona-description').value = p.description || '';
    document.getElementById('persona-system-prompt').value = p.system_prompt || '';
    const list = document.getElementById('examples-list'); list.innerHTML = '';
    for (const ex of (p.begin_dialogs || [])) appendExampleRow(ex.user || '', ex.assistant || '');
}

function activatePersona(p) {
    currentPersona = { ...p };
    document.getElementById('active-persona-label').textContent = p.name ? `🟢 ${p.name}` : '未启用';
}

function appendExampleRow(userText = '', assistantText = '') {
    const list = document.getElementById('examples-list');
    const div = document.createElement('div'); div.className = 'example-pair';
    div.innerHTML = `
        <button class="btn-rm-example" onclick="this.parentElement.remove()">×</button>
        <label>用户</label>
        <textarea placeholder="用户说…" data-role="user">${userText}</textarea>
        <label>角色</label>
        <textarea placeholder="角色回答…" data-role="assistant">${assistantText}</textarea>`;
    list.appendChild(div);
}
function addExample() { appendExampleRow(); }

async function savePersona() {
    const name = document.getElementById('persona-name').value.trim();
    if (!name) { alert('请填写人格名称'); return; }
    if (name === 'default' && document.getElementById('persona-select').value !== 'default') {
        alert('"default" 是保留名称'); return;
    }
    const begin_dialogs = [];
    document.querySelectorAll('#examples-list .example-pair').forEach(pair => {
        const u = pair.querySelector('[data-role=user]').value.trim();
        const a = pair.querySelector('[data-role=assistant]').value.trim();
        if (u || a) begin_dialogs.push({ user: u, assistant: a });
    });
    const p = { name, description: document.getElementById('persona-description').value.trim(),
        system_prompt: document.getElementById('persona-system-prompt').value.trim(), begin_dialogs };
    await fetch('/api/personas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
    await fetchPersonaList();
    document.getElementById('persona-select').value = name;
    activatePersona(p); alert(`✅ 人格「${name}」已保存`);
}

async function deletePersona() {
    const name = document.getElementById('persona-select').value;
    if (!name) { alert('请先选择要删除的人格'); return; }
    if (name === 'default') { alert('default 人格不可删除'); return; }
    if (!confirm(`确认删除人格「${name}」？`)) return;
    await fetch(`/api/personas/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (currentPersona.name === name) activatePersona({ name:'', description:'', system_prompt:'', begin_dialogs:[] });
    await fetchPersonaList();
}

function newPersona() {
    document.getElementById('persona-select').value = '';
    const n = document.getElementById('persona-name');
    n.value = ''; n.readOnly = false; n.style.background = ''; n.title = '';
    document.getElementById('persona-description').value = '';
    document.getElementById('persona-system-prompt').value = '';
    document.getElementById('examples-list').innerHTML = '';
}

// 启动时把 localStorage 里所有 session 的 personaData 同步到服务端，
// 确保下拉栏能列出历史上用过的所有人格。
(async function initPersonas() {
    // 1. 先加载服务端已有的人格
    const serverData = await fetchPersonaList();

    // 2. 收集 localStorage 里所有 session 的 personaData（去重）
    const localPersonas = {};
    for (const s of sessions) {
        const p = s.personaData;
        if (p && p.name && p.name.trim()) {
            localPersonas[p.name] = p;
        }
    }

    // 3. 把服务端没有的人格上传（静默）
    const missing = Object.values(localPersonas).filter(p => !serverData[p.name]);
    if (missing.length > 0) {
        await Promise.all(missing.map(p =>
            fetch('/api/personas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(p)
            }).catch(() => {})
        ));
        // 4. 重新拉取列表（现在包含所有人格）
        await fetchPersonaList();
    }

    // 5. 恢复当前 session 的人格
    const s = sessions.find(x => x.id === currentSessionId);
    const saved = s && s.personaData && s.personaData.name ? s.personaData : null;
    if (saved) {
        applyPersonaToForm(saved);
        activatePersona(saved);
        const sel = document.getElementById('persona-select');
        if (sel) sel.value = saved.name;
    } else {
        const refreshed = await fetchPersonaList().catch(() => ({}));
        const p = refreshed['default'];
        if (p) { applyPersonaToForm(p); activatePersona(p); document.getElementById('persona-select').value = 'default'; }
    }
})();

// ================================================================
// Session management
// ================================================================
let chatHistory = [];
const SESSION_STORE_KEY = 'live2diff_sessions';
let sessions = [], currentSessionId = null;

const CURRENT_SESSION_KEY = 'live2diff_current_session';
function genSessionId() { return 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2,6); }
function persistSessions() { localStorage.setItem(SESSION_STORE_KEY, JSON.stringify(sessions)); }
function persistCurrentSession() { localStorage.setItem(CURRENT_SESSION_KEY, currentSessionId || ''); }

function saveCurrentSession() {
    if (!currentSessionId) return;
    const s = sessions.find(x => x.id === currentSessionId); if (!s) return;
    s.messages = [...chatHistory];
    s.personaName = currentPersona.name;
    s.personaData = { ...currentPersona };
    s.updatedAt = Date.now();
    persistSessions();
    persistCurrentSession();
}

function newSession() {
    saveCurrentSession();
    const id = genSessionId();
    sessions.unshift({ id, name: `对话 ${sessions.length+1}`, createdAt: Date.now(), updatedAt: Date.now(), personaName: currentPersona.name, messages: [] });
    currentSessionId = id; chatHistory = [];
    persistSessions(); renderSessionList(); resetChatDisplay();
}

function switchSession(id) {
    if (id === currentSessionId) return;
    saveCurrentSession();
    const s = sessions.find(x => x.id === id); if (!s) return;
    currentSessionId = id;
    persistCurrentSession();
    chatHistory = [...s.messages];
    if (s.personaData) {
        currentPersona = { ...s.personaData };
        applyPersonaToForm(currentPersona);
        activatePersona(currentPersona);
        const sel = document.getElementById('persona-select');
        if (sel) { sel.value = currentPersona.name || ''; }
    }
    renderSessionList(); replayChatDisplay();
}

function deleteSession(id, e) {
    e.stopPropagation();
    if (sessions.length <= 1) { alert('至少保留一个会话'); return; }
    if (!confirm('删除此会话？')) return;
    sessions = sessions.filter(x => x.id !== id); persistSessions();
    if (currentSessionId === id) {
        currentSessionId = sessions[0].id; chatHistory = [...sessions[0].messages]; replayChatDisplay();
    }
    renderSessionList();
}

function renameSession(id, e) {
    e.stopPropagation();
    const s = sessions.find(x => x.id === id); if (!s) return;
    const name = prompt('重命名', s.name);
    if (name && name.trim()) { s.name = name.trim(); persistSessions(); renderSessionList(); }
}

function renderSessionList() {
    const list = document.getElementById('session-list'); list.innerHTML = '';
    sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
        div.onclick = () => switchSession(s.id);
        div.innerHTML = `<span class="session-name" title="${s.name}">${s.name}</span><button class="btn-del-session">×</button>`;
        div.querySelector('.btn-del-session').onclick = e => deleteSession(s.id, e);
        div.querySelector('.session-name').ondblclick = e => { e.stopPropagation(); renameSession(s.id, e); };
        list.appendChild(div);
    });
}

function resetChatDisplay() {
    document.getElementById('chat-messages').innerHTML = '';
}

function replayChatDisplay() {
    const container = document.getElementById('chat-messages'); container.innerHTML = '';
    if (chatHistory.length === 0) { resetChatDisplay(); return; }
    chatHistory.forEach(m => {
        const d = document.createElement('div');
        d.className = `msg ${m.role}`; d.textContent = m.content;
        container.appendChild(d);
    });
    container.scrollTop = container.scrollHeight;
}

(function initSessions() {
    const saved = localStorage.getItem(SESSION_STORE_KEY);
    if (saved) { try { sessions = JSON.parse(saved); } catch(e) { sessions = []; } }
    if (sessions.length === 0) {
        const id = genSessionId();
        sessions = [{ id, name:'对话 1', createdAt:Date.now(), updatedAt:Date.now(), personaName:'', messages:[] }];
        persistSessions();
    }
    const lastId = localStorage.getItem(CURRENT_SESSION_KEY);
    const target = (lastId && sessions.find(x => x.id === lastId)) || sessions[0];
    currentSessionId = target.id; chatHistory = [...target.messages];
    renderSessionList(); replayChatDisplay();
})();

// ================================================================
// AI chat
// ================================================================
let isStreaming = false;

// Auto-rename session: ask AI to summarize the conversation in ≤8 chars
async function autoRenameSession() {
    const s = sessions.find(x => x.id === currentSessionId);
    if (!s || chatHistory.length < 2) return;
    if (!/^对话 \d+$/.test(s.name)) return; // already renamed manually
    try {
        const msgs = [
            { role: 'system', content: '根据下面的对话内容，用8个字以内的中文词组概括对话主题，只输出词组本身，不要任何标点或其他文字。' },
            ...chatHistory.slice(0, 8)
        ];
        const res = await fetch('/api/chat', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: msgs })
        });
        if (!res.ok) return;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '', title = '';
        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n'); buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const payload = line.slice(6).trim();
                if (payload === '[DONE]') break;
                try { const obj = JSON.parse(payload); if (obj.delta) title += obj.delta; } catch(e) {}
            }
        }
        title = title.trim().replace(/["""''「」【】\n]/g, '').slice(0, 16);
        if (title) { s.name = title; persistSessions(); renderSessionList(); }
    } catch(e) { console.error('autoRename failed:', e); }
}

function handleChatKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function appendMessage(role, content, streaming = false) {
    const container = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`; div.textContent = content;
    if (streaming) {
        const cursor = document.createElement('span');
        cursor.className = 'cursor-blink';
        div.appendChild(cursor); div._streamCursor = cursor;
    }
    container.appendChild(div); container.scrollTop = container.scrollHeight;
    return div;
}

function clearChat() { chatHistory = []; saveCurrentSession(); resetChatDisplay(); }

function buildMessages() {
    const msgs = [];
    if (currentPersona.system_prompt) msgs.push({ role:'system', content:currentPersona.system_prompt });
    for (const ex of (currentPersona.begin_dialogs || [])) {
        if (ex.user)      msgs.push({ role:'user',      content:ex.user });
        if (ex.assistant) msgs.push({ role:'assistant', content:ex.assistant });
    }
    msgs.push(...chatHistory); return msgs;
}

async function sendChat() {
    if (isStreaming) return;
    const input = document.getElementById('chat-input');
    const userText = input.value.trim(); if (!userText) return;

    if (userText === '/reset') {
        input.value = ''; chatHistory = []; saveCurrentSession(); resetChatDisplay();
        appendMessage('assistant', '✅ 上下文已清空，继续聊吧！'); return;
    }

    input.value = '';
    appendMessage('user', userText);
    chatHistory.push({ role:'user', content:userText });

    const btnSend = document.getElementById('btn-send');
    btnSend.disabled = true; isStreaming = true;
    const assistantDiv = appendMessage('assistant', '', true);
    let fullContent = '';

    try {
        const response = await fetch('/api/chat', {
            method:'POST', headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ messages: buildMessages() })
        });
        if (!response.ok) {
            const err = await response.json();
            assistantDiv.className = 'msg error';
            assistantDiv.textContent = '❌ ' + (err.error || '请求失败');
            chatHistory.pop(); return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        const cursor = assistantDiv._streamCursor;

        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream:true });
            const lines = buffer.split('\n'); buffer = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const payload = line.slice(6).trim();
                if (payload === '[DONE]') break;
                try {
                    const obj = JSON.parse(payload);
                    if (obj.error) {
                        assistantDiv.className = 'msg error';
                        assistantDiv.textContent = '❌ ' + obj.error;
                        chatHistory.pop(); return;
                    }
                    if (obj.delta) {
                        fullContent += obj.delta;
                        assistantDiv.textContent = fullContent;
                        if (cursor) assistantDiv.appendChild(cursor);
                        document.getElementById('chat-messages').scrollTop =
                            document.getElementById('chat-messages').scrollHeight;
                    }
                } catch(e) {}
            }
        }

        if (cursor) cursor.remove();
        if (fullContent) {
            chatHistory.push({ role:'assistant', content:fullContent });
            saveCurrentSession(); renderSessionList();
            autoRenameSession(); // background, no await
        }
    } catch(err) {
        assistantDiv.className = 'msg error';
        assistantDiv.textContent = '❌ 网络错误：' + err.message;
        chatHistory.pop();
    } finally { isStreaming = false; btnSend.disabled = false; }
}

// ================================================================
// Agent mode (always on)
// ================================================================

async function agentSendChat(userText) {
    const btnSend = document.getElementById('btn-send');
    btnSend.disabled = true; isStreaming = true;

    // Create a streaming answer bubble immediately
    const container = document.getElementById('chat-messages');
    const answerDiv = document.createElement('div');
    answerDiv.className = 'msg assistant';
    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    answerDiv.appendChild(cursor);
    container.appendChild(answerDiv);
    container.scrollTop = 99999;

    let fullAnswer = '';
    let finalMotion = 'neutral';

    try {
        const res = await fetch('/api/agent/chat', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: userText })
        });
        if (!res.ok) {
            const err = await res.json();
            answerDiv.textContent = '❌ ' + (err.error || '请求失败');
            answerDiv.className = 'msg error';
            return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n'); buffer = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const payload = line.slice(6).trim();
                if (payload === '[DONE]') break;
                try {
                    const ev = JSON.parse(payload);
                    if (ev.type === 'text_delta') {
                        // Stream answer text in real time
                        fullAnswer += ev.delta;
                        answerDiv.textContent = fullAnswer;
                        answerDiv.appendChild(cursor);
                        container.scrollTop = 99999;
                    } else if (ev.type === 'tool_call') {
                        const d = document.createElement('div');
                        d.className = 'msg tool-call';
                        d.textContent = `🔧 调用工具 ${ev.name}…`;
                        container.insertBefore(d, answerDiv);
                        container.scrollTop = 99999;
                    } else if (ev.type === 'tool_result') {
                        const d = document.createElement('div');
                        d.className = 'msg tool-result';
                        d.textContent = '📋 ' + ev.content;
                        container.insertBefore(d, answerDiv);
                        container.scrollTop = 99999;
                    } else if (ev.type === 'answer') {
                        // Final answer metadata (motion badge etc.)
                        finalMotion = ev.motion || 'neutral';
                        if (!fullAnswer && ev.text) {
                            fullAnswer = ev.text;
                            answerDiv.textContent = fullAnswer;
                        }
                        if (finalMotion && finalMotion !== 'neutral') {
                            const badge = document.createElement('span');
                            badge.className = 'motion-badge';
                            badge.textContent = finalMotion;
                            answerDiv.appendChild(badge);
                        }
                    } else if (ev.type === 'motion') {
                        finalMotion = ev.label;
                    } else if (ev.type === 'error') {
                        answerDiv.textContent = '❌ ' + ev.message;
                        answerDiv.className = 'msg error';
                    }
                } catch(e) {}
            }
        }

        // Finalize bubble
        if (cursor.parentNode) cursor.remove();
        if (!fullAnswer) {
            answerDiv.remove();
            // Remove the pre-pushed user message since there's no valid response
            const last = chatHistory[chatHistory.length - 1];
            if (last && last.role === 'user') chatHistory.pop();
        } else {
            // User message already pushed in window.sendChat; push assistant message
            chatHistory.push({ role: 'assistant', content: fullAnswer });
            saveCurrentSession();
            renderSessionList();
            autoRenameSession();
        }
    } catch(err) {
        if (cursor.parentNode) cursor.remove();
        answerDiv.textContent = '❌ 网络错误：' + err.message;
        answerDiv.className = 'msg error';
    } finally {
        isStreaming = false; btnSend.disabled = false;
    }
}

// ================================================================
// Periodic image polling — drains server-side animation queue (view/idle mode only)
// ================================================================
startImagePoll();

window.sendChat = async function() {
    if (isStreaming) return;
    const input = document.getElementById('chat-input');
    const userText = input.value.trim(); if (!userText) return;

    if (userText === '/reset') {
        input.value = ''; chatHistory = []; saveCurrentSession(); resetChatDisplay();
        appendMessage('assistant', '✅ 上下文已清空，继续聊吧！'); return;
    }

    input.value = '';
    appendMessage('user', userText);
    chatHistory.push({ role:'user', content:userText });
    await agentSendChat(userText);
};
